name: Release installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config wayland-protocols cmake

      - name: Install Inno Setup
        if: matrix.os == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"

      - name: Run locked tests and build release executable
        shell: bash
        run: |
          cargo +1.95.0 test --all-targets --locked --target "${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo +1.95.0 build --release --locked --bin rust-vlc --target "${{ matrix.target }}"

      - name: Package Linux installer bundle
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME#v}" = "$version"
          package="$RUNNER_TEMP/rust-vlc-linux-x86_64"
          mkdir -p "$package" dist
          cp "target/${{ matrix.target }}/release/rust-vlc" "$package/rust-vlc"
          cp packaging/linux-install.sh "$package/install.sh"
          cp packaging/RUNTIME.md "$package/README-runtime.md"
          cp assets/fonts/OFL.txt "$package/Inter-OFL.txt"
          chmod +x "$package/rust-vlc" "$package/install.sh"
          printf 'Target: %s\nVersion: %s\nSource commit: %s\n' "${{ matrix.target }}" "$version" "$GITHUB_SHA" > "$package/BUILD-INFO.txt"
          archive="rust-vlc-linux-x86_64-installer.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "dist/$archive" "rust-vlc-linux-x86_64"
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Package Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"$').Groups[1].Value
          if ($env:GITHUB_REF_NAME.TrimStart('v') -ne $version) { throw "Tag version does not match Cargo.toml ($version)" }
          $package = Join-Path $env:RUNNER_TEMP "rust-vlc-windows-x86_64"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $package, $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rust-vlc.exe" (Join-Path $package "rust-vlc.exe")
          Copy-Item "packaging/RUNTIME.md" (Join-Path $package "README-runtime.md")
          Copy-Item "assets/fonts/OFL.txt" (Join-Path $package "Inter-OFL.txt")
          "Target: ${{ matrix.target }}`nVersion: $version`nSource commit: $env:GITHUB_SHA" | Set-Content -Encoding ascii (Join-Path $package "BUILD-INFO.txt")
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$version" "/DSourceDir=$package" "/DOutputDir=$dist" "packaging\windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = Join-Path $dist "rust-vlc-windows-x86_64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  rust-vlc-windows-x86_64-setup.exe" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Package macOS installer
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME#v}" = "$version"
          root="$RUNNER_TEMP/pkg-root"
          app="$root/Applications/Rust-VLC.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp "target/${{ matrix.target }}/release/rust-vlc" "$app/Contents/MacOS/rust-vlc"
          chmod +x "$app/Contents/MacOS/rust-vlc"
          cp packaging/RUNTIME.md "$app/Contents/Resources/README-runtime.md"
          cp assets/fonts/OFL.txt "$app/Contents/Resources/Inter-OFL.txt"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>rust-vlc</string>
            <key>CFBundleIdentifier</key><string>org.rustvlc.desktop</string>
            <key>CFBundleName</key><string>Rust-VLC</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          package="rust-vlc-macos-${{ matrix.arch }}.pkg"
          pkgbuild --root "$root" --identifier org.rustvlc.desktop --version "$version" --install-location / --ownership recommended "dist/$package"
          (cd dist && shasum -a 256 "$package" > "$package.sha256")

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-vlc-${{ matrix.os }}-${{ matrix.arch }}-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: rust-vlc-*-installer
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 8
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Rust-VLC $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

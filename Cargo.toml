[package]
name = "rust-vlc"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
directories = "=6.0.0"
fastrand = "=2.5.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "=0.9.0"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
lofty = "=0.25.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
rfd = "=0.17.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde_json = "=1.0.154"
slint = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"
